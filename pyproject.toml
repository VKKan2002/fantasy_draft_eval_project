[project]
name = "ffeval"
version = "0.1.0"
description = "Fantasy football draft strategy evaluation"
requires-python = ">=3.12"
dependencies = [
    "nflreadpy>=0.1.0",
    "duckdb>=1.0",
    "polars>=1.0",
    "httpx>=0.27",
    "matplotlib>=3.8",
    "pyarrow>=16.0",
    "mcp>=2.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ffeval"]
